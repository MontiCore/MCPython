/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "java"
  id "de.monticore.generator" version "$mc_version"
  id "maven-publish"
  id "com.gradleup.shadow" version "$shadow_plugin_version"
  id 'org.ec4j.editorconfig' version "0.0.3"
}

group = "de.monticore.lang"
description = "MCPython"

java {
  withSourcesJar()
  withJavadocJar()
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

dependencies {
  grammar "de.monticore:monticore-grammar:$mc_version"

  implementation "de.monticore:monticore-runtime:$mc_version"
  implementation "org.jscience:jscience:$jscience_version"


  testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
  testImplementation "org.junit.jupiter:junit-jupiter-engine:$junit_version"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"
  testImplementation "com.github.javaparser:javaparser-symbol-solver-core:3.14.11"
}

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username = mavenUser
    credentials.password = mavenPassword
    url = repo
  }
}

test {
  useJUnitPlatform()
  testLogging {
    exceptionFormat = 'full'
    showStackTraces = true
    showStandardStreams = true
  }

  addTestOutputListener(new TestOutputListener() {
    @Override
    void onOutput(TestDescriptor testDescriptor, TestOutputEvent outputEvent) {
      logger.lifecycle("Test: " + testDescriptor.getName() + " produced standard out/err: " + outputEvent.getMessage())

    }
  })
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = "UTF-8"
}

shadowJar {
  manifest {
    attributes "Main-Class": "de.monticore.umlcd4a.CD4ACLI"
  }
  archiveClassifier = "cli"
}

tasks.register('testReport', TestReport) {
  destinationDirectory = layout.buildDirectory.dir("reports/allTests")
  getTestResults().from(tasks.withType(Test))
}

def testProjects = [
    "bletl"    : "https://github.com/JuBiotech/bletl.git",
    "calibr8"  : "https://github.com/sandialabs/calibr8.git",
    "murefi"   : "https://github.com/JuBiotech/murefi.git",
    "robotools": "https://github.com/JuBiotech/robotools.git"
]

testProjects.forEach { pn, pUrl ->
  def tn = "cloneExternalTestRepos_$pn"
  tasks.register(tn, Exec) {
    def cloneDir = layout.buildDirectory.dir("testRepos/$pn").get().getAsFile().getAbsolutePath()
    commandLine "git", "clone", pUrl, cloneDir
    outputs.dir(cloneDir)
  }
  tasks.test.dependsOn(tasks.named(tn))
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
  repositories.maven {
    credentials.username = mavenUser
    credentials.password = mavenPassword
    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}
