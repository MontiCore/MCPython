name: Test Proposed Changes

concurrency: # run this test workflow only once per "branch"
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push: # run this pipeline on every push
    paths-ignore:
      - "*.md" # do not run this pipeline if the only change was to markdown files
    branches-ignore: [ "dev" ] # Do not run this on the default branch
  workflow_dispatch: # allow starting it by hand ("Run workflow" button in the Actions tab)

env:
  GRADLE_VERSION: 8.5 # Gradle version used
  GRADLE_CLI_OPTS: "-Pci --build-cache --refresh-dependencies " # CLI options passed to Gradle
  GRADLE_BUILD_ACTION_CACHE_KEY_JOB: "test-cache-${{ github.head_ref }}.${{ github.sha }}"

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{env.GRADLE_VERSION}}
      - name: Gradle build
        run: gradle build ${{env.GRADLE_CLI_OPTS}}
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always() # always run even if the previous step fails
        with:
          name: junit-test-results
          path: '**/build/test-results/test/TEST-*.xml'
          retention-days: 1

  # Grammar coverage: compares which Python samples parse on this branch and on dev
  # (see src/test/resources/python-coverage/README.md). A separate job, so it also runs when `build` fails.
  # Fails only if a sample that parses on dev no longer parses on this branch.
  python-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # two builds (branch + dev); guards against a hanging nested Gradle build
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so origin/dev is available as the comparison base
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{env.GRADLE_VERSION}}
      - name: Determine dev commit
        id: base
        run: echo "sha=$(git rev-parse origin/dev)" >> "$GITHUB_OUTPUT"
      - name: Cache dev coverage results
        # compareCoverage checks the cache key itself as well, so a stale cache can never give wrong results
        uses: actions/cache@v4
        with:
          path: build/coverage-base-cache
          key: python-coverage-base-${{ steps.base.outputs.sha }}-${{ hashFiles('src/test/resources/python-coverage/**', 'src/test/java/de/monticore/python/PythonCoverageTest.java', 'gradle/python-coverage.gradle') }}
      - name: Compare coverage with dev
        run: gradle compareCoverage ${{env.GRADLE_CLI_OPTS}}
      - name: Add report to job summary
        if: always() # also show the report when the comparison found files that no longer parse
        run: |
          if [ -f build/reports/compareCoverage/report.md ]; then
            cat build/reports/compareCoverage/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report was created, see the log of the 'Compare coverage with dev' step." >> "$GITHUB_STEP_SUMMARY"
          fi

